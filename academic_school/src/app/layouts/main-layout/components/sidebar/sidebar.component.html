<!--********** SIDEBAR SECTION : TO VERIFIED SIDEBAR WORKING  **********-->
<aside class="sidebar">
  <nav class="sidebar-nav">
    <!--********** SIDEBAR SECTION : DASHBOARD ROUTING NAVIGATION **********-->
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      Dashboard
    </a>

    <!--********** SIDEBAR SECTION : ASSESSMENTS ROUTING NAVIGATION **********-->
    <div class="menu-group">
      <button type="button" class="menu-title" [attr.aria-expanded]="isAssessmentOpen", aria-controls="assessment-submenu", (click)="toggleAssessment()">
        <span>Assessments</span>

        <!--********** SIDEBAR SECTION : ASSESSMENTS SUBMENU ARROW BUTTON **********-->
        <span class="arrow">
          {{ isAssessmentOpen ? '⌃' : '⌄' }}
        </span>
      </button>

      <!--********** ASSESSMENTS SUBMENU : CONDITIONAL DISPLAY **********-->
      @if (isAssessmentOpen) {
        <div class="submenu">
          <!--********** ASSESSMENTS SUBMENU : ASSESSMENTS LIST **********-->
          <a
            routerLink="/assessments"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Assessments List
          </a>
          <!--********** ASSESSMENTS SUBMENU : ASSESSMENTS SCORING **********-->
          <a
            routerLink="/assessments/review-scoring"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
           Assessment Submission
          </a>

          <!--********** ASSESSMENTS SUBMENU : ASSESSMENTS RESULT **********-->
          <a
            routerLink="/assessments/result"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Assessment Result
          </a>
        </div>
      }
    </div>
  </nav>
</aside>
