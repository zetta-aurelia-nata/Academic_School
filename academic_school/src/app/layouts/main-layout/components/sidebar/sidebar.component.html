<!-- ******************** SIDEBAR ******************** -->
<aside class="sidebar">
  <nav class="sidebar-nav">

    <!-- ******************** DASHBOARD ROUTING ******************** -->
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-item">
      
      <mat-icon class="nav-item-icon">dashboard</mat-icon>
      <span class="nav-item-text">Dashboard</span>
    </a>

    <!-- ******************** ASSESSMENTS SUBMENU ******************** -->
    <div class="menu-group">
      <button type="button" class="menu-title" [attr.aria-expanded]="isAssessmentOpen" aria-controls="assessment-submenu" (click)="toggleAssessment()">
        
        <span class="menu-title-content">
          <mat-icon class="menu-title-icon">assignment</mat-icon>
          <span>Assessments</span>
        </span>

        <span class="arrow">{{ assessmentArrowIcon }}</span>
      </button>

      @if (isAssessmentOpen) {
        <div class="submenu" id="assessment-submenu">
          
         <!-- ******************** SUBMENU ITEMS LOOP ******************** -->
          @for (submenu of assessmentSubmenus; track submenu.id) {
            <a [routerLink]="submenu.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
              {{ submenu.label }}
            </a>
          }
        </div>
      }
    </div>
  </nav>
</aside>
