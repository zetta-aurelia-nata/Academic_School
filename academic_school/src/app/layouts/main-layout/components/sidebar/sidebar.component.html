<aside class="sidebar">
  <nav class="sidebar__nav">
    <!-- ******************** APP LOGO ******************** -->
    <div class="sidebar__logo-text">
      <div class="sidebar-text">
        <mat-icon class="welcome-banner__icon"> school </mat-icon>

        <span class="sidebar__logo-title"> EduAssess </span>
        <div class="sidebar-tagline">
          <span class="sidebar__logo-tagline"> Learn. Assess. Grow. </span>
        </div>
      </div>
    </div>

    <!-- ******************** DASHBOARD ROUTING ******************** -->
    <a
      routerLink="/dashboard"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar__item"
    >
      <mat-icon class="sidebar__item-icon">dashboard</mat-icon>
      <span class="sidebar__item-text">Dashboard</span>
    </a>

    <!-- ******************** ASSESSMENTS SUBMENU ******************** -->
    <div class="sidebar__group">
      <button
        type="button"
        class="sidebar__menu"
        [attr.aria-expanded]="isAssessmentOpen"
        aria-controls="assessment-submenu"
        (click)="toggleAssessment()"
      >
        <span class="sidebar__menu-content">
          <mat-icon class="sidebar__menu-icon">assignment</mat-icon>
          <span class="sidebar__menu-text">Assessments</span>
        </span>
        <span class="sidebar__menu-arrow">{{ assessmentArrowIcon }}</span>
      </button>
      @if (isAssessmentOpen) {
        <div class="sidebar__submenu" id="assessment-submenu">
          <!-- ******************** SUBMENU ITEMS LOOP ******************** -->
          @for (submenu of assessmentSubmenus; track submenu.id) {
            <a
              [routerLink]="submenu.link"
              routerLinkActive="sidebar__submenu-item--active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="sidebar__submenu-item"
            >
              {{ submenu.label }}
            </a>
          }
        </div>
      }
    </div>
  </nav>
</aside>
