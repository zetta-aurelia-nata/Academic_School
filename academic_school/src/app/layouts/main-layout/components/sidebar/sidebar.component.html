<!--********** SIDEBAR SECTION **********-->
<aside class="sidebar" *transloco="let t; read: 'layout.sidebar'">
  <!--********** SIDEBAR LOGO **********-->
  <div class="sidebar__logo">
    <div class="sidebar__logo-icon">
      <mat-icon>school</mat-icon>
    </div>

    <div class="sidebar__logo-content">
      <div class="sidebar__logo-title">EduAssess</div>

      <div class="sidebar__logo-tagline">{{ t('logoTagline') }}</div>
    </div>
  </div>

  <!--********** SIDEBAR NAVIGATION **********-->
  <nav class="sidebar__nav">
    <!--********** DASHBOARD MENU **********-->
    <a
      routerLink="/dashboard"
      routerLinkActive="sidebar__item--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="sidebar__item"
      (click)="onNavigationSelected()"
    >
      <mat-icon class="sidebar__item-icon">dashboard</mat-icon>

      <span class="sidebar__item-text">{{ t('menu.dashboard') }}</span>
    </a>

    <!--********** ASSESSMENTS MENU **********-->
    <div class="sidebar__group">
      <button
        type="button"
        class="sidebar__menu"
        [attr.aria-expanded]="isAssessmentOpen"
        aria-controls="assessment-submenu"
        (click)="toggleAssessment()"
      >
        <span class="sidebar__menu-content">
          <mat-icon class="sidebar__menu-icon">assignment</mat-icon>

          <span class="sidebar__menu-text">{{ t('menu.assessments') }}</span>
        </span>

        <mat-icon class="sidebar__menu-arrow">
          {{ isAssessmentOpen ? 'expand_less' : 'expand_more' }}
        </mat-icon>
      </button>

      <!--********** ASSESSMENTS SUBMENU **********-->
      @if (isAssessmentOpen) {
        <div id="assessment-submenu" class="sidebar__submenu">
          @for (submenu of assessmentSubmenus; track submenu.id) {
            <a
              [routerLink]="submenu.link"
              routerLinkActive="sidebar__submenu-item--active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="sidebar__submenu-item"
              (click)="onNavigationSelected()"
            >
              {{ t(submenu.translationKey) }}
            </a>
          }
        </div>
      }
    </div>
  </nav>
</aside>
