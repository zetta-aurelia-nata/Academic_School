<header class="header">
  <!-- ******************** MOBILE MENU TOGGLE ******************** -->
  <button type="button" class="header-menu-toggle" aria-label="Toggle sidebar" (click)="toggleSidebar()">
    <mat-icon>menu</mat-icon>
  </button>

  <!-- ******************** APP LOGO ******************** -->
  <div class="header-logo">
    <div class="header-logo-text">
      <span class="header-logo-title">EduAssess</span>
      <span class="header-logo-tagline">Learn. Assess. Grow.</span>
    </div>
  </div>

  <!-- ******************** PAGE TITLE ******************** -->
  <div class="header-page">
    <h1 class="header-page-title">Assessment Management</h1>
  </div>

  <div class="header-actions">
    <!-- ******************** DIVIDER ******************** -->
    <div class="header-divider"></div>

    <!-- ******************** USER PROFILE ******************** -->
    <div class="header-user-profile">
      <div class="header-user-avatar">
        <img src="assets/images/placeholder/user-avatar.jpg" alt="user-avatar" />
      </div>

      <div class="header-user-info">
        <span class="header-user-name">Ms. Aurelia</span>
        <span class="header-user-role">Teacher</span>
      </div>

      <span class="header-user-profile-chevron">&#8964;</span>
    </div>
  </div>
</header>
