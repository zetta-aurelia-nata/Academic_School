<!--********** APP MAIN LAYOUT **********-->
<div class="main-layout">
  <!--********** SIDEBAR SECTION **********-->
  <aside class="main-layout__sidebar" [class.main-layout__sidebar--open]="isSidebarOpen">
    <app-sidebar (navigationSelected)="closeSidebar()"></app-sidebar>
  </aside>

  <!--********** SIDEBAR OVERLAY **********-->
  @if (isSidebarOpen) {
    <button
      type="button"
      class="main-layout__backdrop"
      aria-label="Close sidebar"
      (click)="closeSidebar()"
    ></button>
  }

  <!--********** MAIN AREA **********-->
  <div class="main-layout__right">
    <!--********** HEADER SECTION **********-->
    <header class="main-layout__header">
      <app-header (sidebarToggle)="toggleSidebar()"></app-header>
    </header>

    <!--********** CONTENT SECTION : ROUTER OUTLET **********-->
    <main class="main-layout__main">
      <div class="main-layout__content">
        <!--********** PAGE CONTENT **********-->
        <div class="main-layout__page">
          <router-outlet></router-outlet>
        </div>

        <!--********** FOOTER SECTION **********-->
        <footer class="main-layout__footer">
          <app-footer></app-footer>
        </footer>
      </div>
    </main>
  </div>
</div>
