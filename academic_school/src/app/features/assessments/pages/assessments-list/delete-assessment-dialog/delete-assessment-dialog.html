<!--********** DELETE ASSESSMENT DIALOG **********-->
<div class="delete-dialog">
  <!--********** DIALOG HEADER **********-->
  <div class="mb-5 flex items-center justify-center gap-2">
    <!--********** DELETE ICON **********-->
    <div
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-red-50 text-red-500 mt-10"
    >
      <mat-icon>delete_outline</mat-icon>
    </div>

    <!--********** DIALOG TITLE **********-->
    <div>
      <h2
        mat-dialog-title
        class="m-0 text-lg font-bold text-[var(--color-title)]"
      >
        Delete Assessment?
      </h2>
    </div>
  </div>

  <!--********** DELETE CONFIRMATION MESSAGE **********-->
  <p
    mat-dialog-content
    class="mb-6 text-center text-[13px] leading-5 text-[var(--color-text-secondary)]"
  >
    Are you sure you want to delete

    <strong class="font-semibold text-[var(--color-title)]">
      {{ assessment.title }}
    </strong>
    ?
  </p>

  <!--********** DIALOG ACTIONS **********-->
  <div
    mat-dialog-actions
    class="flex justify-center gap-3 max-sm:flex-col-reverse"
  >
    <!--********** CANCEL DELETE **********-->
    <button
      type="button"
      mat-stroked-button
      class="!h-10 !rounded-[10px] !border-[var(--color-border)] !px-5 !text-[13px] !font-semibold !text-[var(--color-title)] max-sm:!w-full"
      (click)="onCancel()"
    >
      Cancel
    </button>

    <!--********** CONFIRM DELETE **********-->
    <button
      type="button"
      mat-flat-button
      class="!h-10 !rounded-[10px] !bg-red-500 !px-5 !text-[13px] !font-semibold !text-white max-sm:!w-full"
      (click)="onConfirm()"
    >
      Delete
    </button>
  </div>
</div>
