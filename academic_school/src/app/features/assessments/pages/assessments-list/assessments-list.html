<!--********** VERIFIED: ASSESSMENT LIST ROUTE WORKING **********-->
<section class="assessment-list">
  <!--********** PAGE TOOLBAR **********-->
  <mat-toolbar class="list-toolbar">
    <div class="list-toolbar-text">
      <h1 class="list-toolbar-title">Assessments List</h1>
      <span class="list-toolbar-subtitle">{{ assessments.length }} total assessments</span>
    </div>

    <span class="list-toolbar-spacer"></span>

    <button mat-stroked-button class="list-toolbar-btn">
      <mat-icon>download</mat-icon>
      Export
    </button>

    <button mat-flat-button color="primary" class="list-toolbar-btn" (click)="onCreateAssessment()">
      <mat-icon>add</mat-icon>
      Create Assessment
    </button>
  </mat-toolbar>

  <!--********** TABLE CARD **********-->
  <mat-card class="list-card">
    <div class="table-wrapper">
      <table mat-table [dataSource]="assessments" class="assessment-table">
        <!-- Title -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Assessment Name</th>
          <td mat-cell *matCellDef="let row">{{ row.title }}</td>
        </ng-container>

        <!-- Subject -->
        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef>Subject</th>
          <td mat-cell *matCellDef="let row">{{ row.subject }}</td>
        </ng-container>

        <!-- Grade -->
        <ng-container matColumnDef="grade">
          <th mat-header-cell *matHeaderCellDef>Grade</th>
          <td mat-cell *matCellDef="let row">{{ row.grade }}</td>
        </ng-container>

        <!-- Total Students -->
        <ng-container matColumnDef="totalStudents">
          <th mat-header-cell *matHeaderCellDef>Students</th>
          <td mat-cell *matCellDef="let row">{{ row.totalStudents }}</td>
        </ng-container>

        <!-- Status -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let row">
            <span [ngClass]="statusClass(row.status)">{{ row.status }}</span>
          </td>
        </ng-container>

        <!-- Date -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>
          <td mat-cell *matCellDef="let row">{{ row.date | date: 'MMM d, y' }}</td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <button mat-icon-button aria-label="View" (click)="onView(row)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-icon-button aria-label="Edit" (click)="onEdit(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button aria-label="Delete" (click)="onDelete(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card>
</section>
