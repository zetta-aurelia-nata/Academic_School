<!--********** ASSESSMENT LIST SECTION **********-->
<section
  class="assessment-list w-full min-h-full bg-[var(--color-background-content)] px-8 pt-[30px] pb-10 max-lg:px-5 max-lg:pt-6 max-md:px-4 max-md:pt-5"
>
  <!--********** TOOLBAR **********-->
  <mat-toolbar
    class="list-toolbar !mb-6 !flex !h-auto !min-h-0 !items-center !gap-3 !bg-transparent !p-0 max-md:!flex-col max-md:!items-stretch"
  >
    <!--********** TOOLBAR TEXT **********-->
    <div class="flex flex-col gap-1">
      <h1 class="m-0 text-2xl font-bold leading-[1.2] text-[var(--color-title)] max-lg:text-[22px]">
        Assessments List
      </h1>

      <span class="text-[13px] text-[var(--color-text-secondary)]">
        {{ assessments.length }} total assessments
      </span>
    </div>

    <span class="flex-1 max-md:hidden"></span>

    <!--********** EXPORT ACTION **********-->
    <button
      mat-stroked-button
      class="list-toolbar__btn list-toolbar__btn--export !inline-flex !h-10 !items-center !justify-center !gap-2 !rounded-[10px] !px-[18px] !text-[13px] !font-semibold max-md:!w-full"
    >
      <mat-icon class="!h-[18px] !w-[18px] !text-[18px]"> download </mat-icon>

      <span>Export</span>
    </button>

    <!--********** CREATE ACTION **********-->
    <button
      mat-flat-button
      color="primary"
      class="list-toolbar__btn list-toolbar__btn--create !inline-flex !h-10 !items-center !justify-center !gap-2 !rounded-[10px] !px-[18px] !text-[13px] !font-semibold max-md:!w-full"
      (click)="onCreateAssessment()"
    >
      <mat-icon class="!h-[18px] !w-[18px] !text-[18px]"> add </mat-icon>

      <span>Create Assessment</span>
    </button>
  </mat-toolbar>

  <!--********** TABLE CARD **********-->
  <mat-card
    class="list-card !overflow-hidden !rounded-[14px] !border !border-[var(--color-border)] !bg-[var(--color-white)] !p-0"
  >
    <!--********** TABLE CONTAINER **********-->
    <div class="w-full overflow-x-auto">
      <table mat-table [dataSource]="assessments" class="assessment-table w-full min-w-[850px]">
        <!--********** TITLE COLUMN **********-->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Assessment Name</th>

          <td mat-cell *matCellDef="let row">
            <!--********** ASSESSMENT TITLE **********-->
            <div
              class="flex items-center gap-3 text-[13px] font-semibold text-[var(--color-title)]"
            >
              <!--********** ASSESSMENT ICON **********-->
              <div
                class="flex h-[38px] w-[38px] shrink-0 items-center justify-center rounded-[10px] bg-[var(--color-primary-light)] text-[var(--color-primary-dark)]"
              >
                <mat-icon class="!h-[19px] !w-[19px] !text-[19px]"> assignment </mat-icon>
              </div>

              <span>
                {{ row.title }}
              </span>
            </div>
          </td>
        </ng-container>

        <!--********** SUBJECT COLUMN **********-->
        <ng-container matColumnDef="subject">
          <th mat-header-cell *matHeaderCellDef>Subject</th>

          <td mat-cell *matCellDef="let row">
            {{ row.subject }}
          </td>
        </ng-container>

        <!--********** GRADE COLUMN **********-->
        <ng-container matColumnDef="grade">
          <th mat-header-cell *matHeaderCellDef>Grade</th>

          <td mat-cell *matCellDef="let row">
            {{ row.grade }}
          </td>
        </ng-container>

        <!--********** STUDENTS COLUMN **********-->
        <ng-container matColumnDef="totalStudents">
          <th mat-header-cell *matHeaderCellDef>Students</th>

          <td mat-cell *matCellDef="let row">
            {{ row.totalStudents }}
          </td>
        </ng-container>

        <!--********** STATUS COLUMN **********-->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>

          <td mat-cell *matCellDef="let row">
            <span [ngClass]="statusClass(row.status)">
              <span class="status-badge__dot"></span>
              {{ row.status }}
            </span>
          </td>
        </ng-container>

        <!--********** DATE COLUMN **********-->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date</th>

          <td mat-cell *matCellDef="let row">
            <div class="inline-flex items-center gap-2 text-[var(--color-title)]">
              <mat-icon class="!text-base !text-[var(--color-text-secondary)]">
                calendar_today
              </mat-icon>

              <span>
                {{ row.date | date: 'MMM d, y' }}
              </span>
            </div>
          </td>
        </ng-container>

        <!--********** ACTIONS COLUMN **********-->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>

          <td mat-cell *matCellDef="let row">
            
            <!--********** TABLE ACTIONS **********-->
            <div class="flex items-center gap-2">

              <!--********** EDIT ACTION **********-->
              <button
                mat-icon-button
                class="assessment-table__action assessment-table__action--edit"
                aria-label="Edit assessment"
                (click)="onEdit(row)"
              >
                <mat-icon>edit</mat-icon>
              </button>

              <!--********** DELETE ACTION **********-->
              <button
                mat-icon-button
                class="assessment-table__action assessment-table__action--delete"
                aria-label="Delete assessment"
                (click)="onDelete(row)"
              >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <!--********** TABLE ROWS **********-->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  </mat-card>
</section>
