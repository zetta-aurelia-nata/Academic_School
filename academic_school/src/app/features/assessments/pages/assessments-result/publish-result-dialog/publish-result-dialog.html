<!--********** PUBLISH RESULT DIALOG **********-->
<div class="publish-dialog">
  <!--********** PUBLISH ICON **********-->
  <div
    class="mb-4 flex h-11 w-11 items-center justify-center rounded-full bg-[var(--color-primary-light)] text-[var(--color-primary-dark)]"
  >
    <mat-icon>publish</mat-icon>
  </div>

  <!--********** DIALOG TITLE **********-->
  <h2
    mat-dialog-title
    class="m-0 text-[16px] font-bold text-[var(--color-title)]"
  >
    Publish Assessment Result?
  </h2>

  <!--********** DIALOG DESCRIPTION **********-->
  <p
    mat-dialog-content
    class="m-0 mt-2 text-[12px] leading-[1.5] text-[var(--color-text-secondary)]"
  >
    Once published, the results will become visible to students. Make sure all
    scores have been reviewed before publishing.
  </p>

  <!--********** DIALOG ACTIONS **********-->
  <div
    mat-dialog-actions
    class="mt-6 flex justify-end gap-2"
  >
    <!--********** CANCEL PUBLISH **********-->
    <button
      mat-button
      [mat-dialog-close]="false"
      class="!rounded-[8px] !text-[12px] !font-semibold"
    >
      Cancel
    </button>

    <!--********** CONFIRM PUBLISH **********-->
    <button
      mat-flat-button
      [mat-dialog-close]="true"
      class="!rounded-[8px] !bg-[var(--color-primary-dark)] !px-4 !text-[12px] !font-semibold !text-white"
    >
      Publish Result
    </button>
  </div>
</div>
