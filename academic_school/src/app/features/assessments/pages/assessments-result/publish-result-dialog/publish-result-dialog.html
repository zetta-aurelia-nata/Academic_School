<!--********** PUBLISH RESULT DIALOG **********-->
<div class="publish-dialog">
  <!--********** DIALOG HEADER **********-->
  <div class="publish-dialog__header">
    <!--********** PUBLISH ICON **********-->
    <div class="publish-dialog__icon">
      <mat-icon>publish</mat-icon>
    </div>

    <!--********** DIALOG TITLE **********-->
    <div class="publish-dialog__title">
      <h2 mat-dialog-title>Publish Assessments Result?</h2>
    </div>
  </div>

  <!--********** DIALOG DESCRIPTION **********-->
  <p mat-dialog-content class="publish-dialog__description">
    Once published, the results will become visible to students. Make sure all scores have been
    reviewed before publishing.
  </p>

  <!--********** DIALOG ACTIONS **********-->
  <div mat-dialog-actions class="publish-dialog__actions">
    <!--********** CANCEL PUBLISH **********-->
    <button mat-button [mat-dialog-close]="false" class="publish-dialog__cancel">Cancel</button>

    <!--********** CONFIRM PUBLISH **********-->
    <button mat-flat-button [mat-dialog-close]="true" class="publish-dialog__confirm">
      Publish Result
    </button>
  </div>
</div>
